name: Install approved recordings

# Run it by hand from the Actions tab (Run workflow).
#
# This repo deliberately has NO schedule trigger. Recordings are shared with
# councilgritter/nghe through one Cloudflare R2 bucket, and that repo's hourly job
# is the sole writer. Two scheduled installers would race on the same
# <region>/<clip>.mp3 keys with no knowledge of each other. This repo only reads
# the bucket (AUDIO_BASE in index.html); it never writes to it.
#
# Only re-enable the schedule here if you also disable it in councilgritter/nghe.
on:
  workflow_dispatch:

concurrency: install-recordings   # never two installs at once

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install boto3

      - name: Fetch approved recordings and upload to R2
        env:
          COLLECTOR_URL:        ${{ secrets.COLLECTOR_URL }}
          COLLECTOR_KEY:        ${{ secrets.COLLECTOR_KEY }}
          R2_ENDPOINT:          ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python scripts/install_recordings.py
