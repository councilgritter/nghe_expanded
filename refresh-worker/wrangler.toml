#:schema node_modules/wrangler/config-schema.json
name = "reading-refresh"
main = "worker.js"
compatibility_date = "2025-01-01"

# A daily counter, so a leaked password cannot spend without bound.  Create it with:
#   npx wrangler kv namespace create RATE_LIMIT
# then paste the id below.
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
GITHUB_REPO = "councilgritter/nghe_expanded"
GITHUB_REF = "main"
# Set this to the site's origin so other pages cannot use the endpoint:
ALLOWED_ORIGIN = "https://councilgritter.github.io"
MAX_RUNS_PER_DAY = "6"

# Secrets are NOT in this file. Put them in with:
#   npx wrangler secret put REFRESH_PASSWORD
#   npx wrangler secret put GITHUB_TOKEN
