<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đọc — luyện đọc tiếng Việt</title>
<!--
  Reading practice. Loads a static bundle exported by reading/tools/build_site.py.

  Design constraints this page exists to honour:
    * A tap must resolve from the token map already on the device. No API call on
      the normal path — that is what keeps per-tap cost at zero.
    * Segmentation is sometimes wrong, so a selection can be grown or shrunk by
      syllable. The alternatives the reconciler kept are offered as one-tap fixes.
    * Only when the tapped offset has no token, or the token has no definition, is
      one sentence sent for disambiguation — and the answer is cached locally.

  Attribution: VOA and BBC both require credit, so the source notice exported with
  each article is always rendered with it.
-->
<style>
  :root{
    --bg:#12100e; --panel:#1c1917; --line:#2f2a26; --ink:#f5f0e8;
    --dim:#a89f94; --accent:#e0a458; --good:#7fb069; --warn:#d98c5f;
    --sel:#3b3020; --amber:#3a2d17;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:0 0 4rem}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:20;background:rgba(18,16,14,.96);
    border-bottom:1px solid var(--line);padding:.7rem 1rem;
    display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em}
  header .sp{flex:1}
  select,button{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:.55rem;padding:.4rem .6rem}
  button{cursor:pointer}
  button:active{transform:translateY(1px)}
  .wrap{max-width:44rem;margin:0 auto;padding:1rem}

  /* --- article list --- */
  .list a{display:block;padding:.75rem .85rem;margin:.5rem 0;background:var(--panel);
    border:1px solid var(--line);border-radius:.7rem;text-decoration:none;color:var(--ink)}
  .list a .t{font-weight:600;line-height:1.35}
  .list a .m{color:var(--dim);font-size:.78rem;margin-top:.3rem;
    display:flex;gap:.5rem;flex-wrap:wrap}
  .badge{font-size:.7rem;border:1px solid var(--line);border-radius:1rem;
    padding:.05rem .4rem;color:var(--dim)}
  .badge.src-voa{color:var(--accent)} .badge.src-bbc{color:var(--warn)}

  /* --- reader --- */
  .src{margin:.2rem 0 1rem}
  .src .t{font-size:1.35rem;line-height:1.4;margin:0 0 .35rem}
  .src .d{color:var(--dim);font-size:.8rem}
  #text{font-size:1.42rem;line-height:2.15;letter-spacing:.005em}
  #text p{margin:0 0 1.05rem}
  .w{cursor:pointer;border-radius:.25rem;padding:.06em 0;
    transition:background-color .12s}
  .w:hover{background:var(--panel)}
  .w.on{background:var(--sel);box-shadow:0 0 0 1px var(--accent) inset}
  .w.amb{border-bottom:1px dotted var(--warn)}

  /* --- pre-teach --- */
  .pre{margin:0 0 1.2rem;background:var(--panel);border:1px solid var(--line);
    border-radius:.7rem;overflow:hidden}
  .pre summary{padding:.6rem .8rem;cursor:pointer;font-weight:600;font-size:.9rem}
  .pre .in{padding:0 .8rem .8rem}
  .pre h4{margin:.7rem 0 .35rem;font-size:.75rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim)}
  .pre .row{padding:.4rem 0;border-top:1px solid var(--line)}
  .pre .term{font-weight:600}
  .pre .gloss{color:var(--dim);font-size:.86rem;line-height:1.5;margin-top:.15rem}
  .pre .eg{color:var(--dim);font-size:.8rem;font-style:italic;margin-top:.2rem}
  .pre .lv{font-size:.7rem;color:var(--accent);border:1px solid var(--line);
    border-radius:1rem;padding:0 .35rem;margin-left:.35rem}

  /* --- definition sheet --- */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(102%);
    transition:transform .18s ease;background:var(--panel);
    border-top:1px solid var(--line);border-radius:1rem 1rem 0 0;
    box-shadow:0 -14px 30px rgba(0,0,0,.45)}
  #sheet.open{transform:translateY(0)}
  #sheet .bd{max-width:44rem;margin:0 auto;padding:.85rem 1rem 1.4rem}
  #sheet .hd{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  #sheet .form{font-size:1.3rem;font-weight:700}
  #sheet .meta{color:var(--dim);font-size:.75rem}
  #sheet .def{margin:.5rem 0 .1rem;line-height:1.55}
  #sheet .cand{margin-top:.5rem;font-size:.8rem;color:var(--dim)}
  #sheet .acts{display:flex;gap:.4rem;margin-top:.75rem;flex-wrap:wrap}
  #sheet .acts button{padding:.35rem .5rem;font-size:.82rem}
  #sheet .note{margin-top:.6rem;font-size:.78rem;color:var(--dim)}
  #sheet .x{position:absolute;right:.7rem;top:.55rem;background:none;border:0;
    color:var(--dim);font-size:1.3rem;line-height:1;padding:.2rem .4rem}

  .foot{margin-top:2rem;padding-top:.9rem;border-top:1px solid var(--line);
    color:var(--dim);font-size:.78rem;line-height:1.6}
  .err{background:var(--panel);border:1px solid var(--warn);border-radius:.7rem;
    padding:.9rem;line-height:1.6;font-size:.9rem}
  code{background:var(--panel);border:1px solid var(--line);border-radius:.3rem;
    padding:.05rem .3rem;font-size:.85em}
</style>
</head>
<body>

<header>
  <h1>Đọc</h1>
  <span class="sp"></span>
  <select id="level" title="Trình độ"></select>
  <button id="back" hidden>← Danh sách</button>
</header>

<div class="wrap">
  <div id="listHost" class="list"></div>

  <div id="readHost" hidden>
    <div class="src">
      <h2 class="t" id="title"></h2>
      <div class="d" id="sub"></div>
    </div>
    <details class="pre" id="preBox" hidden>
      <summary id="preSummary">Từ vựng và ngữ pháp cần biết trước</summary>
      <div class="in" id="preIn"></div>
    </details>
    <div id="text"></div>
    <div class="foot" id="foot"></div>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="false" aria-label="Nghĩa của từ">
  <button class="x" id="sheetClose" aria-label="Đóng">×</button>
  <div class="bd">
    <div class="hd">
      <span class="form" id="shForm"></span>
      <span class="meta" id="shMeta"></span>
    </div>
    <div class="def" id="shDef"></div>
    <div class="cand" id="shCand" hidden></div>
    <div class="acts" id="shActs"></div>
    <div class="note" id="shNote" hidden></div>
  </div>
</div>

<script src="reader.js"></script>
</body>
</html>
