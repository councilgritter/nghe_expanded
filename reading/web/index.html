<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#12100e">
<title>Đọc — luyện đọc tiếng Việt</title>
<!--
  Reading practice. Loads a static bundle exported by reading/tools/build_site.py.

  Design constraints this page exists to honour:
    * A tap must resolve from the token map already on the device. No API call on
      the normal path — that is what keeps per-tap cost at zero.
    * Segmentation is sometimes wrong, so a selection can be grown or shrunk by
      syllable, and any range of words can be looked up in the offline dictionary
      index the bundle carries. The alternatives the reconciler kept are offered as
      one-tap fixes.
    * Only when the tapped offset has no token, or the token has no definition, is
      one sentence sent for disambiguation — and the answer is cached locally.
    * Nothing reaches the API key: the optional refresh button posts a password to a
      configured endpoint, and the endpoint (never this page) holds the key.

  Attribution: VOA and BBC both require credit, so the source notice exported with
  each article is always rendered with it.

  Theme: theme.js is loaded synchronously so there is no flash of the wrong palette.
-->
<script src="../../theme.js"></script>
<style>
  :root{
    --bg:#12100e; --panel:#1c1917; --line:#2f2a26; --ink:#f5f0e8;
    --dim:#a89f94; --accent:#e0a458; --good:#7fb069; --warn:#d98c5f;
    --sel:#3b3020; --amber:#3a2d17; --bad:#d98c5f;
  }
  [data-theme="light"]{
    --bg:#faf7f2; --panel:#ffffff; --line:#e2dbd0; --ink:#1d1a17;
    --dim:#6d655c; --accent:#a86a15; --good:#3f7d3a; --warn:#b4602e;
    --sel:#f6e6c8; --amber:#f6e6c8; --bad:#b4602e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%}
  body{padding:0 0 4rem}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:20;background:var(--bg);
    border-bottom:1px solid var(--line);padding:.7rem 1rem;
    display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
  header h1{font-size:1rem;margin:0;font-weight:600;letter-spacing:.02em}
  header .sp{flex:1}
  header a.home{color:var(--dim);text-decoration:none;font-size:.85rem;
    border:1px solid var(--line);border-radius:.55rem;padding:.4rem .6rem}
  header a.home:hover{color:var(--ink);border-color:var(--accent)}
  select,button,input,textarea{font:inherit;color:var(--ink);background:var(--panel);
    border:1px solid var(--line);border-radius:.55rem;padding:.4rem .6rem}
  button{cursor:pointer}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:default}
  .wrap{max-width:44rem;margin:0 auto;padding:1rem}

  /* --- article list --- */
  .list a{display:block;padding:.75rem .85rem;margin:.5rem 0;background:var(--panel);
    border:1px solid var(--line);border-radius:.7rem;text-decoration:none;color:var(--ink)}
  .list a .t{font-weight:600;line-height:1.35}
  .list a .m{color:var(--dim);font-size:.78rem;margin-top:.3rem;
    display:flex;gap:.5rem;flex-wrap:wrap}
  .badge{font-size:.7rem;border:1px solid var(--line);border-radius:1rem;
    padding:.05rem .4rem;color:var(--dim)}
  .badge.src-voa{color:var(--accent)} .badge.src-bbc{color:var(--warn)}

  /* --- reader --- */
  .src{margin:.2rem 0 1rem}
  .src .t{font-size:1.35rem;line-height:1.4;margin:0 0 .35rem}
  .src .d{color:var(--dim);font-size:.8rem}
  #text{font-size:1.42rem;line-height:2.15;letter-spacing:.005em}
  #text p{margin:0 0 1.05rem}
  .w{cursor:pointer;border-radius:.25rem;padding:.06em 0;
    transition:background-color .12s}
  .w:hover{background:var(--panel)}
  .w.on{background:var(--sel);box-shadow:0 0 0 1px var(--accent) inset}
  .w.amb{border-bottom:1px dotted var(--warn)}
  .w.speaking{background:var(--amber)}
  /* Dragging across words selects them; without this the browser's own selection
     would fight the tap handler. */
  #text{user-select:none;-webkit-user-select:none}
  #text .para-play{float:right;margin:-.35rem 0 0 .5rem;font-size:.8rem;
    padding:.1rem .35rem;opacity:.5}
  #text .para-play:hover{opacity:1}

  /* --- toolbar under the title --- */
  .tools{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap;margin:.6rem 0 1rem}
  .tools button{font-size:.82rem}
  .tools .lbl{color:var(--dim);font-size:.78rem}

  /* --- pre-teach --- */
  .pre{margin:0 0 1.2rem;background:var(--panel);border:1px solid var(--line);
    border-radius:.7rem;overflow:hidden}
  .pre summary{padding:.6rem .8rem;cursor:pointer;font-weight:600;font-size:.9rem}
  .pre .in{padding:0 .8rem .8rem}
  .pre h4{margin:.7rem 0 .35rem;font-size:.75rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim)}
  .pre .row{padding:.4rem 0;border-top:1px solid var(--line)}
  .pre .term{font-weight:600}
  .pre .gloss{color:var(--dim);font-size:.86rem;line-height:1.5;margin-top:.15rem}
  .pre .gloss.vi{font-style:italic}
  .pre .eg{color:var(--dim);font-size:.8rem;font-style:italic;margin-top:.2rem}
  .pre .lv{font-size:.7rem;color:var(--accent);border:1px solid var(--line);
    border-radius:1rem;padding:0 .35rem;margin-left:.35rem}

  /* --- practice: comprehension + writing --- */
  .ex{margin:2rem 0 0;background:var(--panel);border:1px solid var(--line);
    border-radius:.7rem;overflow:hidden}
  .ex summary{padding:.7rem .85rem;cursor:pointer;font-weight:600;font-size:.95rem}
  .ex .in{padding:0 .85rem 1rem}
  .ex h4{margin:1rem 0 .4rem;font-size:.75rem;text-transform:uppercase;
    letter-spacing:.08em;color:var(--dim)}
  .q{padding:.6rem 0;border-top:1px solid var(--line)}
  .q .ask{font-weight:600;line-height:1.5}
  .q .opt{display:block;width:100%;text-align:left;margin:.35rem 0;font-size:.95rem;
    line-height:1.5}
  .q .opt.right{border-color:var(--good);color:var(--good)}
  .q .opt.wrong{border-color:var(--bad);color:var(--bad)}
  .q .why{color:var(--dim);font-size:.85rem;line-height:1.5;margin-top:.4rem}
  .ex textarea{width:100%;min-height:5.5rem;line-height:1.6;resize:vertical}
  .ex .hint{margin-top:.5rem;font-size:.88rem;line-height:1.6;color:var(--dim)}
  .ex .hint b{color:var(--ink)}
  .ex .kp{list-style:none;padding:0;margin:.4rem 0 0}
  .ex .kp li{margin:.2rem 0;font-size:.88rem}
  .ex .kp .hit{color:var(--good)} .ex .kp .miss{color:var(--dim)}
  .ex .count{color:var(--dim);font-size:.78rem;margin-top:.3rem}
  .score{font-size:.85rem;color:var(--dim);margin-top:.6rem}

  /* --- definition sheet --- */
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(102%);
    transition:transform .18s ease;background:var(--panel);
    border-top:1px solid var(--line);border-radius:1rem 1rem 0 0;
    box-shadow:0 -14px 30px rgba(0,0,0,.45)}
  #sheet.open{transform:translateY(0)}
  #sheet .bd{max-width:44rem;margin:0 auto;padding:.85rem 1rem 1.4rem;
    max-height:70vh;overflow-y:auto}
  #sheet .hd{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
  #sheet .form{font-size:1.3rem;font-weight:700}
  #sheet .meta{color:var(--dim);font-size:.75rem}
  #sheet .def{margin:.5rem 0 .1rem;line-height:1.55}
  /* The English meaning from the local dictionary leads; the Vietnamese gloss
     from the model sits underneath, visually subordinate to it. */
  #sheet .def .en{font-size:1.08rem;font-weight:600}
  #sheet .def .alt{color:var(--dim);font-size:.86rem;margin-top:.15rem}
  #sheet .def .vi{color:var(--dim);font-size:.9rem;margin-top:.4rem;
    padding-top:.4rem;border-top:1px solid var(--line)}
  #sheet .def .none{color:var(--dim)}
  #sheet .cand{margin-top:.5rem;font-size:.8rem;color:var(--dim)}
  #sheet .acts{display:flex;gap:.4rem;margin-top:.75rem;flex-wrap:wrap}
  #sheet .acts button{padding:.35rem .5rem;font-size:.82rem}
  #sheet .note{margin-top:.6rem;font-size:.78rem;color:var(--dim)}
  #sheet .x{position:absolute;right:.7rem;top:.55rem;background:none;border:0;
    color:var(--dim);font-size:1.3rem;line-height:1;padding:.2rem .4rem}

  .foot{margin-top:2rem;padding-top:.9rem;border-top:1px solid var(--line);
    color:var(--dim);font-size:.78rem;line-height:1.6}
  .err{background:var(--panel);border:1px solid var(--warn);border-radius:.7rem;
    padding:.9rem;line-height:1.6;font-size:.9rem}
  code{background:var(--panel);border:1px solid var(--line);border-radius:.3rem;
    padding:.05rem .3rem;font-size:.85em}
</style>
</head>
<body>

<header>
  <!-- Back to the mode picker, so switching between the app's two halves is never
       a one-way trip. The entry screen asks each time; this is the way there. -->
  <a class="home" href="../../index.html" title="Về trang chọn chế độ">← Trang chủ</a>
  <h1>Đọc</h1>
  <span class="sp"></span>
  <button id="themeToggle" title="Đổi nền sáng/tối">◐ <span id="themeLabel">Nền sáng</span></button>
  <select id="level" title="Trình độ"></select>
  <button id="refresh" hidden title="Cập nhật bài mới">↻ Cập nhật</button>
  <button id="back" hidden>← Danh sách</button>
</header>

<div class="wrap">
  <div id="listHost" class="list"></div>

  <div id="readHost" hidden>
    <div class="src">
      <h2 class="t" id="title"></h2>
      <div class="d" id="sub"></div>
    </div>

    <div class="tools" id="tools">
      <button id="playAll" title="Đọc toàn bài">▶ Đọc bài</button>
      <button id="stopSpeak" title="Dừng đọc" disabled>■ Dừng</button>
      <span class="lbl">Tốc độ</span>
      <select id="rate" title="Tốc độ đọc">
        <option value="0.7">0.7×</option>
        <option value="0.85">0.85×</option>
        <option value="1" selected>1×</option>
      </select>
      <select id="voice" title="Giọng đọc"></select>
    </div>

    <details class="pre" id="preBox" hidden>
      <summary id="preSummary">Từ vựng và ngữ pháp cần biết trước</summary>
      <div class="in" id="preIn"></div>
    </details>

    <div id="text"></div>

    <details class="ex" id="exBox" hidden>
      <summary id="exSummary">Bài tập</summary>
      <div class="in" id="exIn"></div>
    </details>

    <div class="foot" id="foot"></div>
  </div>
</div>

<div id="sheet" role="dialog" aria-modal="false" aria-label="Nghĩa của từ">
  <button class="x" id="sheetClose" aria-label="Đóng">×</button>
  <div class="bd">
    <div class="hd">
      <span class="form" id="shForm"></span>
      <span class="meta" id="shMeta"></span>
    </div>
    <div class="def" id="shDef"></div>
    <div class="cand" id="shCand" hidden></div>
    <div class="acts" id="shActs"></div>
    <div class="note" id="shNote" hidden></div>
  </div>
</div>

<script src="reader.js"></script>
</body>
</html>
